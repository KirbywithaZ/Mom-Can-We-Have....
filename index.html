<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Game Selection</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background-color: #f9f9f9;
    }
    header, footer {
      background-color: #333;
      color: white;
      text-align: center;
      padding: 15px 0;
    }
    header h1 {
      margin: 0;
      font-size: 28px;
    }
    footer p {
      margin: 0;
      font-size: 14px;
    }
    main {
      padding: 40px;
      text-align: center;
    }
    .game-list {
      list-style: none;
      padding: 0;
      margin: 0 auto;
      max-width: 400px;
    }
    .game-list li {
      margin: 20px 0;
    }
    .game-list a {
      display: block;
      padding: 12px;
      background-color: #0066cc;
      color: white;
      text-decoration: none;
      border-radius: 6px;
      font-size: 18px;
      transition: background-color 0.3s ease;
    }
    .game-list a:hover {
      background-color: #ff6600;
    }
  </style>
</head>
<body>
  <header>
    <h1>Welcome to the Game Hub</h1>
  </header>

  <main>
    <h2>Select a Game to Play</h2>
    <ul class="game-list">
      <li><a href="Super Mario Odyssey.html">Super Mario Odyssey</a></li>
      <li><a href="Donkey Kong Bananza.html">Donkey Kong Bananza</a></li>
      <li><a href="More.html">More Games...</a></li>
    </ul>
  </main>

  <footer>
    <p>&copy; 2026 Game Hub. All rights reserved.</p>
  </footer>
</body>
</html>
