<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Mario Odyssey - Web Edition</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #000; }
        
        #gui-container {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            text-shadow: 0 4px 8px rgba(0,0,0,0.5);
            pointer-events: none;
            z-index: 10;
        }
        .stat-row { display: flex; align-items: center; margin-bottom: 5px; }
        .stat-icon { font-size: 32px; margin-right: 12px; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5)); }
        .stat-text { font-size: 42px; font-weight: 900; font-style: italic; -webkit-text-stroke: 1.5px black; }
        
        #overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, #ff4081 0%, #c2185b 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            color: white;
            cursor: pointer;
            text-align: center;
            transition: opacity 0.5s ease;
        }
        #overlay h1 {
            font-size: 80px;
            margin: 0;
            letter-spacing: -4px;
            text-transform: uppercase;
            text-shadow: 0 10px 0 #880e4f, 0 15px 30px rgba(0,0,0,0.5);
            transform: skew(-5deg);
        }
        .start-prompt {
            font-size: 24px;
            margin-top: 20px;
            animation: pulse 1.5s infinite;
            text-transform: uppercase;
            font-weight: bold;
            letter-spacing: 2px;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.05); }
        }

        #instructions {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            color: white;
            padding: 15px 40px;
            border-radius: 50px;
            font-size: 14px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.3);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .capture-label {
            position: absolute;
            top: 20px;
            right: 20px;
            background: #ffeb3b;
            color: #000;
            padding: 12px 24px;
            border-radius: 30px;
            font-weight: 900;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            display: none;
            text-transform: uppercase;
            border: 3px solid black;
        }
    </style>
</head>
<body>

    <div id="overlay">
        <h1>Odyssey</h1>
        <div style="font-size: 24px; font-weight: bold; background: white; color: #c2185b; padding: 5px 20px; border-radius: 5px; transform: rotate(-2deg);">WEB EDITION</div>
        <p class="start-prompt">Press to Start</p>
        <div style="margin-top: 40px; font-size: 14px; color: rgba(255,255,255,0.8); line-height: 1.6;">
            <b>ARROWS</b>: Move | <b>SPACE</b>: Jump | <b>SHIFT</b>: Dash<br>
            <b>E</b>: Throw Cappy | <b>GOOMBA STACK</b>: Jump on other Goombas!
        </div>
    </div>

    <div id="gui-container">
        <div class="stat-row">
            <span class="stat-icon">🌙</span>
            <span class="stat-text" id="moon-count">0</span>
        </div>
        <div class="stat-row">
            <span class="stat-icon">🪙</span>
            <span class="stat-text" id="coin-count" style="font-size: 28px; color: #ffeb3b;">0</span>
        </div>
    </div>

    <div id="capture-ui" class="capture-label">Captured: Goomba Stack (Q to Release)</div>

    <div id="instructions">
        ARROWS to Move | SPACE to Jump | SHIFT to Dash | E to Throw | Q to Release
    </div>

    <script>
        // --- CONSTANTS ---
        const CONFIG = {
            gravity: -0.015,
            marioJump: 0.38,
            goombaJump: 0.25,
            marioSpeed: 0.2,
            goombaSpeed: 0.12,
            dashPower: 0.6,
            dashDecay: 0.9,
            cappySpeed: 0.75,
            cappyRange: 13,
            capJumpBoost: 0.52, 
            cappyStayDuration: 90 
        };

        // --- GLOBALS ---
        let scene, camera, renderer, clock;
        let player, cappy, currentCapture = null;
        let goombaStackCount = 1;
        let keys = {};
        let moons = [], coins = [], platforms = [], enemies = [];
        let moonCollected = 0, coinCollected = 0;
        let isJumping = false, velocityY = 0;
        let isCappyOut = false, yaw = 0, pitch = -0.2, gameActive = false;
        let capJumpAvailable = false;
        let dashVelocity = new THREE.Vector3();

        // --- CUSTOM SHADER MATERIAL FOR SAND ---
        // Creating a custom shader that generates noise-based grain for the desert look
        const sandShader = {
            uniforms: THREE.UniformsUtils.merge([
                THREE.UniformsLib['lights'],
                {
                    color: { value: new THREE.Color(0xedc9af) },
                    time: { value: 0.0 }
                }
            ]),
            vertexShader: `
                varying vec3 vNormal;
                varying vec3 vWorldPosition;
                void main() {
                    vNormal = normalize(normalMatrix * normal);
                    vec4 worldPosition = modelMatrix * vec4(position, 1.0);
                    vWorldPosition = worldPosition.xyz;
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                }
            `,
            fragmentShader: `
                uniform vec3 color;
                uniform float time;
                varying vec3 vNormal;
                varying vec3 vWorldPosition;

                float hash(vec3 p) {
                    p = fract(p * 0.3183099 + 0.1);
                    p *= 17.0;
                    return fract(p.x * p.y * p.z * (p.x + p.y + p.z));
                }

                void main() {
                    // Generate grain based on world position
                    float grain = hash(floor(vWorldPosition * 25.0));
                    vec3 finalColor = color;
                    
                    // Add light/dark specks
                    finalColor += (grain - 0.5) * 0.12;
                    
                    // Simple lighting calculation
                    vec3 lightDir = normalize(vec3(50.0, 100.0, 50.0));
                    float diff = max(dot(vNormal, lightDir), 0.0);
                    
                    gl_FragColor = vec4(finalColor * (diff * 0.6 + 0.5), 1.0);
                }
            `
        };

        function getSandMaterial(baseColor) {
            const material = new THREE.ShaderMaterial({
                uniforms: THREE.UniformsUtils.clone(sandShader.uniforms),
                vertexShader: sandShader.vertexShader,
                fragmentShader: sandShader.fragmentShader,
                lights: true
            });
            if (baseColor) material.uniforms.color.value.set(baseColor);
            return material;
        }

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87CEEB); 
            scene.fog = new THREE.Fog(0x87CEEB, 80, 250);

            camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 1000);
            
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            document.body.appendChild(renderer.domElement);

            clock = new THREE.Clock();

            setupLights();
            createEnvironment();
            createPlayer();
            createCappy();
            spawnEnemies();
            spawnCollectibles();

            window.addEventListener('keydown', e => {
                keys[e.code] = true;
                if(e.code === 'KeyE' && gameActive) handleAction();
                if(e.code === 'KeyQ' && currentCapture) releaseCapture();
                if((e.code === 'ShiftLeft' || e.code === 'ShiftRight') && gameActive) dash();
            });
            window.addEventListener('keyup', e => keys[e.code] = false);
            
            document.getElementById('overlay').addEventListener('click', () => {
                document.body.requestPointerLock();
            });

            document.addEventListener('pointerlockchange', () => {
                gameActive = (document.pointerLockElement === document.body);
                document.getElementById('overlay').style.opacity = gameActive ? '0' : '1';
                document.getElementById('overlay').style.pointerEvents = gameActive ? 'none' : 'auto';
            });

            document.addEventListener('mousemove', (e) => {
                if (gameActive) {
                    yaw -= e.movementX * 0.0025;
                    pitch -= e.movementY * 0.0025;
                    pitch = Math.max(-Math.PI/2.2, Math.min(Math.PI/6, pitch));
                }
            });

            window.addEventListener('resize', onWindowResize);
            animate();
        }

        function setupLights() {
            scene.add(new THREE.AmbientLight(0xffffff, 0.6));
            const sun = new THREE.DirectionalLight(0xffffff, 1.2);
            sun.position.set(50, 100, 50);
            sun.castShadow = true;
            sun.shadow.mapSize.set(2048, 2048);
            sun.shadow.camera.left = -200; sun.shadow.camera.right = 200;
            sun.shadow.camera.top = 200; sun.shadow.camera.bottom = -200;
            scene.add(sun);
        }

        function createEnvironment() {
            // Ground with custom sand shader
            const ground = new THREE.Mesh(new THREE.PlaneGeometry(1200, 1200), getSandMaterial());
            ground.rotation.x = -Math.PI / 2;
            ground.receiveShadow = true;
            scene.add(ground);
            platforms.push(ground);

            // TOWER COMPLEX
            addStructure(60, 4, 60, 0, 1, -80, getSandMaterial(0xc2a48c));
            addStructure(50, 4, 50, 0, 4, -80, getSandMaterial(0xd2b48c));
            addStructure(40, 10, 40, 0, 10, -80, getSandMaterial(0x8b7355));
            addStructure(25, 10, 25, 0, 20, -80, getSandMaterial(0x9b8365));
            addStructure(10, 15, 10, 0, 32, -80, getSandMaterial(0xcdad00)); 

            // PATHS
            addStructure(12, 1, 20, 0, 1, -40, getSandMaterial(0x8b7355));
            addStructure(12, 1, 15, 0, 5, -55, getSandMaterial(0x8b7355));
            
            const steps = 8;
            for(let i=0; i<steps; i++) {
                const angle = (i / steps) * Math.PI * 1.5;
                const radius = 18;
                const x = Math.cos(angle) * radius;
                const z = Math.sin(angle) * radius - 80;
                addStructure(6, 1, 6, x, 15 + i*3, z, getSandMaterial(0x8b4513));
            }

            // DECORATIONS
            for(let i=0; i<30; i++) {
                const x = Math.random() * 400 - 200;
                const z = Math.random() * 400 - 200;
                if (Math.abs(x) < 40 && z < -40) continue;
                createCactus(x, 0, z);
            }

            for(let i=0; i<25; i++) {
                const x = Math.random() * 300 - 150;
                const z = Math.random() * 300 - 150;
                if (Math.abs(x) < 30 && z < -30) continue;
                const height = 2 + Math.random() * 12;
                addStructure(3, height, 3, x, height/2, z, getSandMaterial(0x8b7355));
                if(Math.random() > 0.5) addStructure(2, 1, 2, x + 3, 0.5, z + 1, getSandMaterial(0x8b7355));
            }

            addStructure(40, 1, 40, -100, 0.5, 50, getSandMaterial(0x40a040)); 
            addStructure(15, 8, 15, -100, 4, 50, getSandMaterial(0x8b7355)); 
            addStructure(12, 0.5, 12, 80, 22, 40, getSandMaterial(0xcdad00));
            addStructure(4, 0.5, 30, 80, 22, 15, getSandMaterial(0x8b4513)); 
        }

        function createCactus(x, y, z) {
            const cactus = new THREE.Group();
            const body = new THREE.Mesh(
                new THREE.CylinderGeometry(0.5, 0.5, 4, 8),
                new THREE.MeshPhongMaterial({ color: 0x2d5a27 })
            );
            body.position.y = 2;
            cactus.add(body);
            if(Math.random() > 0.3) {
                const arm = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.3, 1.5, 8), new THREE.MeshPhongMaterial({ color: 0x2d5a27 }));
                arm.position.set(0.6, 2.5, 0);
                arm.rotation.z = Math.PI / 3;
                cactus.add(arm);
            }
            cactus.position.set(x, y, z);
            cactus.castShadow = true;
            scene.add(cactus);
        }

        function addStructure(w, h, d, x, y, z, material) {
            const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), material);
            mesh.position.set(x, y, z);
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            scene.add(mesh);
            platforms.push(mesh);
        }

        function createPlayer() {
            if(player) scene.remove(player);
            player = new THREE.Group();
            
            if(currentCapture === 'goomba') {
                for(let i=0; i < goombaStackCount; i++) {
                    const gBody = new THREE.Mesh(new THREE.SphereGeometry(0.7, 12, 12), new THREE.MeshPhongMaterial({color: 0x8b4513}));
                    gBody.position.y = 0.7 + (i * 1.2);
                    player.add(gBody);
                    if(i === goombaStackCount - 1) {
                        const hat = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.4, 0.15, 12), new THREE.MeshPhongMaterial({color: 0xff0000}));
                        hat.position.y = 1.4 + (i * 1.2);
                        player.add(hat);
                    }
                }
            } else {
                const body = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.4, 0.8, 12), new THREE.MeshPhongMaterial({color: 0xff0000}));
                body.position.y = 0.8;
                player.add(body);
                const head = new THREE.Mesh(new THREE.SphereGeometry(0.35, 12, 12), new THREE.MeshPhongMaterial({color: 0xffdbac}));
                head.position.y = 1.4;
                player.add(head);
                const hat = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.4, 0.15, 12), new THREE.MeshPhongMaterial({color: 0xff0000}));
                hat.position.y = 1.65;
                hat.name = "mario_hat";
                player.add(hat);
            }
            scene.add(player);
        }

        function createCappy() {
            cappy = new THREE.Group();
            const hatBase = new THREE.Mesh(new THREE.CylinderGeometry(0.45, 0.45, 0.18, 16), new THREE.MeshPhongMaterial({ color: 0xff0000 }));
            cappy.add(hatBase);
            const eyeGeo = new THREE.SphereGeometry(0.09, 8, 8);
            const eyeMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
            const eL = new THREE.Mesh(eyeGeo, eyeMat); eL.position.set(0.15, 0.05, 0.35);
            const eR = eL.clone(); eR.position.set(-0.15, 0.05, 0.35);
            cappy.add(eL, eR);
            cappy.visible = false;
            scene.add(cappy);
        }

        function spawnEnemies() {
            const locations = [[20, 1, -20], [-50, 1, 40], [0, 11, -80], [100, 1, -100], [-100, 1, 80], [40, 1, 60], [-80, 1, -50]];
            locations.forEach(loc => {
                const goomba = new THREE.Group();
                const body = new THREE.Mesh(new THREE.SphereGeometry(0.7, 10, 10), new THREE.MeshPhongMaterial({color: 0x8b4513}));
                body.position.y = 0.7;
                goomba.add(body);
                goomba.position.set(...loc);
                goomba.userData = { type: 'goomba' };
                scene.add(goomba);
                enemies.push(goomba);
            });
        }

        function spawnCollectibles() {
            const moonGeo = new THREE.CylinderGeometry(0.6, 0.6, 0.15, 16);
            const moonMat = new THREE.MeshPhongMaterial({ color: 0xffff00, emissive: 0x666600 });
            [[0, 41.5, -80], [80, 23.5, 40], [-100, 9.5, 50], [150, 1, 150]].forEach(p => {
                const m = new THREE.Mesh(moonGeo, moonMat);
                m.position.set(...p);
                m.rotation.z = Math.PI/2;
                scene.add(m); moons.push(m);
            });
            for(let i=0; i<80; i++) {
                const coin = new THREE.Mesh(new THREE.CylinderGeometry(0.25, 0.25, 0.05, 12), new THREE.MeshPhongMaterial({color: 0xffd700}));
                coin.position.set(Math.random()*400-200, 0.5, Math.random()*400-200);
                coin.rotation.z = Math.PI/2;
                scene.add(coin); coins.push(coin);
            }
        }

        function handleAction() {
            if (!isCappyOut && !currentCapture) throwCappy();
        }

        function dash() {
            const forward = new THREE.Vector3(0, 0, 1).applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);
            dashVelocity.copy(forward).multiplyScalar(CONFIG.dashPower);
        }

        function throwCappy() {
            isCappyOut = true;
            cappy.visible = true;
            capJumpAvailable = true;
            cappy.position.copy(player.position).add(new THREE.Vector3(0, 1.4, 0));
            const forward = new THREE.Vector3(0,0,1).applyQuaternion(player.quaternion);
            cappy.userData = { dir: forward, dist: 0, returning: false, stayTime: CONFIG.cappyStayDuration };
            const mHat = player.getObjectByName("mario_hat");
            if(mHat) mHat.visible = false;
        }

        function captureEnemy(enemy) {
            currentCapture = enemy.userData.type;
            goombaStackCount = 1;
            const pos = enemy.position.clone();
            scene.remove(enemy);
            enemies = enemies.filter(e => e !== enemy);
            createPlayer();
            player.position.copy(pos);
            velocityY = 0.2;
            isCappyOut = false;
            cappy.visible = false;
            document.getElementById('capture-ui').style.display = 'block';
        }

        function releaseCapture() {
            const pos = player.position.clone();
            currentCapture = null;
            goombaStackCount = 1;
            createPlayer();
            player.position.copy(pos);
            player.position.y += 2;
            velocityY = 0.3;
            document.getElementById('capture-ui').style.display = 'none';
        }

        function update() {
            if (!gameActive) return;

            // Camera
            const camDir = new THREE.Vector3(0, 0, 1).applyAxisAngle(new THREE.Vector3(1, 0, 0), pitch).applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);
            const camTarget = player.position.clone().add(new THREE.Vector3(0, 1.5 + (goombaStackCount * 0.6), 0));
            camera.position.copy(camTarget).sub(camDir.clone().multiplyScalar(15 + (goombaStackCount * 1.2)));
            camera.lookAt(camTarget);

            // Movement
            const moveDir = new THREE.Vector3();
            if (keys['ArrowUp']) moveDir.z += 1;
            if (keys['ArrowDown']) moveDir.z -= 1;
            if (keys['ArrowLeft']) moveDir.x += 1;
            if (keys['ArrowRight']) moveDir.x -= 1;

            const speed = currentCapture === 'goomba' ? CONFIG.goombaSpeed : CONFIG.marioSpeed;

            if (moveDir.length() > 0) {
                moveDir.normalize();
                const forward = new THREE.Vector3(0, 0, 1).applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);
                const right = new THREE.Vector3(1, 0, 0).applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);
                const finalDir = new THREE.Vector3().addScaledVector(forward, moveDir.z).addScaledVector(right, moveDir.x).normalize();
                player.position.addScaledVector(finalDir, speed);
                player.rotation.y = Math.atan2(finalDir.x, finalDir.z);
            }

            player.position.add(dashVelocity);
            dashVelocity.multiplyScalar(CONFIG.dashDecay);

            // Jump
            if (keys['Space'] && !isJumping) {
                isJumping = true;
                velocityY = currentCapture === 'goomba' ? (CONFIG.goombaJump * (1 + (goombaStackCount * 0.15))) : CONFIG.marioJump;
            }

            // Cappy
            if (isCappyOut) {
                cappy.rotation.y += 0.4;
                if (!cappy.userData.returning) {
                    cappy.position.addScaledVector(cappy.userData.dir, CONFIG.cappySpeed);
                    cappy.userData.dist += CONFIG.cappySpeed;
                    enemies.forEach(e => {
                        if (cappy.position.distanceTo(e.position.clone().add(new THREE.Vector3(0,0.7,0))) < 1.8) {
                            captureEnemy(e);
                        }
                    });
                    if (cappy.userData.dist > CONFIG.cappyRange) cappy.userData.returning = true;
                } else {
                    if (cappy.userData.stayTime > 0) {
                        cappy.userData.stayTime--;
                        if (capJumpAvailable && player.position.distanceTo(cappy.position) < 2.0 && velocityY < 0.1) {
                            velocityY = CONFIG.capJumpBoost;
                            capJumpAvailable = false;
                            cappy.userData.stayTime = 0; 
                        }
                    } else {
                        const toPlayer = player.position.clone().add(new THREE.Vector3(0, 1.4, 0)).sub(cappy.position);
                        if (toPlayer.length() < 1.2) { 
                            isCappyOut = false; cappy.visible = false; 
                            const mHat = player.getObjectByName("mario_hat");
                            if(mHat) mHat.visible = true;
                        } else {
                            cappy.position.addScaledVector(toPlayer.normalize(), CONFIG.cappySpeed * 1.3);
                        }
                    }
                }
            }

            // Goomba Stacking Detection
            if (currentCapture === 'goomba') {
                enemies.forEach(e => {
                    if (player.position.distanceTo(e.position) < 1.8) {
                        if (velocityY < 0 && player.position.y > e.position.y + 0.5) {
                            goombaStackCount++;
                            scene.remove(e);
                            enemies = enemies.filter(item => item !== e);
                            createPlayer();
                            velocityY = 0.2; 
                        }
                    }
                });
            }

            // Gravity & Collision
            velocityY += CONFIG.gravity;
            player.position.y += velocityY;

            platforms.forEach(plat => {
                const box = new THREE.Box3().setFromObject(plat);
                const pBox = new THREE.Box3().setFromCenterAndSize(player.position.clone().add(new THREE.Vector3(0,0.8,0)), new THREE.Vector3(1.2,1.6,1.2));
                if (box.intersectsBox(pBox)) {
                    if (velocityY < 0 && player.position.y >= box.max.y - 0.7) {
                        player.position.y = box.max.y;
                        velocityY = 0;
                        isJumping = false;
                        capJumpAvailable = true;
                    }
                }
            });

            if (player.position.y < -30) { player.position.set(0, 5, 0); velocityY = 0; }

            // Collectibles
            moons.forEach(m => {
                if (m.visible) {
                    m.rotation.y += 0.05;
                    if (player.position.distanceTo(m.position) < 2.2 + (goombaStackCount * 0.5)) {
                        m.visible = false; moonCollected++;
                        document.getElementById('moon-count').innerText = moonCollected;
                    }
                }
            });
            coins.forEach(c => {
                if (c.visible) {
                    c.rotation.y += 0.1;
                    if (player.position.distanceTo(c.position) < 1.5 + (goombaStackCount * 0.5)) {
                        c.visible = false; coinCollected++;
                        document.getElementById('coin-count').innerText = coinCollected;
                    }
                }
            });
        }

        function animate() {
            requestAnimationFrame(animate);
            update();
            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        window.onload = init;
    </script>
</body>
</html>
